<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to EZList</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        @font-face {
            font-family: Louis_George_Cafe;
            src: url("/asset?file=Louis-George-Cafe.ttf&type=font/tff");
        }
        body {
            font-family: Louis_George_Cafe;
        }
        input {
            font-family: Louis_George_Cafe;
        }
    </style>
</head>
<body>
    <div style="z-index:9999;position:fixed;top:0;left:0;width:100%;height:100%;background-color:white;" id="cover"></div>
    <div style="width:100%;height:100%;display:flex;position:fixed;justify-content:center;align-items:center;">
        <div style="transform:scale(1.5);">
            <span style="font-size:20px">Choose a username</span>
            <br/>
            <input type="text" id="username" placeholder="coolguy123" style="border-radius:4px;border-top-left-radius:0;border-width:1px;border-style:solid;padding:3px;">
            <br/>
            <div style="height:8px"></div>
            <span style="font-size:20px">Choose a password</span>
            <br/>
            <input type="password" id="password" placeholder="••••••••••••••••••••" style="border-radius:4px;border-top-left-radius:0;border-width:1px;border-style:solid;padding:3px;">
            <br/>
            <div style="height:8px"></div>
            <input type="button" style="width:100%" id="submit" value="Sign Up">
            <br/>
            <span style="text-align:center;font-size:12px;" id="info-text"></span>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(window).on("load",() => $("#cover").fadeOut(500));
        // Primarily backend connected
        async function taken() {
            const fetchResp = await fetch(`/user-exists?username=${document.getElementById("username").value}`);
            const txt = await fetchResp.text();
            return txt === "true"; // User exists -> taken
        }
        // Primarily frontend connected
        async function submitSequence() {
            document.getElementById("submit").disabled = true;
            const Taken = await taken();
            if(!Taken) {
                await fetch(`/user-create?username=${document.getElementById("username").value}&password=${document.getElementById("password").value}`);
                $("#cover").fadeIn(500);
                setTimeout(() => window.location.href = "/",500);
            } else {
                document.getElementById("submit").disabled = false;
                document.getElementById("info-text").innerHTML = "<span style='color:red;'>That username is taken</span>";                
            }
        }
        window.addEventListener("keydown",e => {
            if(e.key == "Enter") {
                if(!document.getElementById("submit").disabled) submitSequence(); // async
            }
        });
        document.getElementById("submit").addEventListener("click",e => {
            submitSequence(); // async
        });
        document.getElementById("username").addEventListener("focus",e => {
            document.getElementById("username").style.outline = "none";
        });
        document.getElementById("password").addEventListener("focus",e => {
            document.getElementById("password").style.outline = "none";
        });
    </script>
</body>
</html>
